<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style></style>
    <script>
        // 0.0~0.999 사이 랜덤 숫자
        function randomInt(start, end) {
            return Math.floor(Math.random()*9 +1);
        }
    </script>
</head>
<body>
    <h3>구구단 연습</h3>
    <hr>
    <script>
        let ques = randomInt() + "*" + randomInt();
        let user = prompt(ques + "=? 정답을 쓰세요")
        if(user == null) {
            document.write("end");
        }
        else {
            let ans = eval(ques);
            if (ans == user)
                document.write("correct! <br>")
            else
                document.write("wrong! <br>");
            document.write(ques+"="+"<strong>"+ans+"</strong>입니다<br>")
        }
    </script>
</body>
</html>
