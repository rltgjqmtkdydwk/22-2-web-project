<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style></style>
    <script>

        /* 직접 호출하기
        function inquiry() { return this.balance; }
        function deposit(money) { this.balance = this.balance + money; }
        function withdraw() { this.balance -= money; return money; }

        let account = new Object();
        account.owner = "김은총";
        account.code = "12345678";
        account.balance = 15000;
        account.inquiry = inquiry; //함수를 정하기위해 위에 만들어놓기
        account.deposit = deposit;
        account.withdraw = withdraw;
        */


        /* literal 방식으로 만들기
        let account = {
            owner: "김은총",
            code: "1234 5678",
            balance: 15000,

            inquiry: function() { return this.balance;},
            deposit: function(money) { this.balance = this.balance + money; }
            // withdraw: function() { this.balance -= money; return money; }
        }
        */


        // proto타입으로 만들기

        function account(owner, code, balance)
        // property
        this.owner = owner;
        this.code = code;
        this.balance = balance;

        // method
        this.inquiry = function(money) { this.balance = money; }
        this.withdraw = function(money) { this.balance = money; return money; }

    </script>
</head>
<body>
    <script>

        document.write("소유주: " + account.owner + "<br>");
        document.write("계좌번호: " + account.code + "<br>");
        //잔액조회 방법1(직접 호출)
        document.write("잔액: " + account.balance + "<br>");
        //잔액조회 방법2(메소드 통해 호출; 더 좋은 접근)
        document.write("잔액: " + account.inquiry + "<br>")
        
        account.deposit(4);
        document.write("잔액: " + account.balance + "<br>")
        account.deposit(2);
        document.write("잔액: " + account.balance + "<br>")
        
    </script>
</body>
</html>
