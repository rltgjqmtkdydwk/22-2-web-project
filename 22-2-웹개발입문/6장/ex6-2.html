<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방법2. script 태그에 자바스크립트 코드 작성</title>
    <script>
        function over(obj) {
            obj.src="media/mio.png";
        }
        function out(obj) {
            obj.src="media/spongebob.png";
        }
    </script>
</head>
<body>
    <h3>onmouseover here</h3>
    <hr>
    <img src="media/mio.png" alt="이미지"
    onmouseover="over(this)"
    onmouseout="out(this)">
</body>
</html>
