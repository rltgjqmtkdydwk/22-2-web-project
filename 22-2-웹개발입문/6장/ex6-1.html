<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>방법1. HTMl태그의 이벤트 리스너 속성에 자바스크립트 코드 작성</title>
    <style>
        img{
            width: 500px;
        }
    </style>
    <script></script>
</head>
<body>
    <h3>onmouseover here</h3>
    <hr>
    <img src="media/mio.png" alt="mio"
    onmouseover="this.src='media/spongebob.png'"
    onmouseout="this.src='media/mio.png'">
</body>
</html>
