<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>시간 정보 입력 응용</title>
</head>
<body>
<h3>생일축하합니다</h3>
<hr>
당신의 생일은 2003년 11월 7일입니다. 틀리면 수정하시고 
파티시간과 장소를 입력하세요.
<hr>
<form>
<table>
    <tr><td>생일</td>
    <td><input type="date" value="2003-11-07"></td></tr>
    <tr><td>생일타피시간</td>
        <td><input type="time"></td></tr>    
    <tr><td>생일파디장소</td>
        <td><input type="text"></td></tr>
</table>
</form>
</body>
</html>
