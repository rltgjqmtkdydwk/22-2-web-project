<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>설문지</title>
<link rel="stylesheet" type="text/css" href="file:///Users/kslivergun/work/HTML,%20CSS/웹개발입문/10:18%202차%20과제제출/김은총_202214048_survey05.css">
</head>

<body>
<form>
    <header>
        <div class="survey_head">
            <h1>설문지</h1>
            소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
        </div>
    </header>

    <section>
        <div class="item1">학년
            <input type="radio" name="grade" value="1"> 1학년
            <input type="radio" name="grade" value="2"> 2학년
            <input type="radio" name="grade" value="3"> 3학년
            <input type="radio" name="grade" value="4"> 4학년
        </div>

        <div class="item2">성별
            <input type="radio" name="gender" value="남"> 남
            <input type="radio" name="gender" value="여"> 여
        </div>

        <div class="item3">관심분야
            <select name="관심분야" id="관심분야">
            <option value="모바일 소프트웨어">모바일 소프트웨어</option>
            </select>
        </div>

        <div class="item4">진로
            <input type="checkbox" name="work" value="개발"> 개발
            <input type="checkbox" name="work" value="기획"> 기획
            <input type="checkbox" name="work" value="영업"> 영업
            <input type="checkbox" name="work" value="창업"> 창업
        </div>

        <label for="leaveamessage">남기고 싶은 말</label>
        <textarea id="leaveamessage" name="leaveamessage" rows="10" cols="50">글을 남겨주세요</textarea><br>
    </section>
</form>

<footer>
    copyright 2022 by Kiatae
</footer>
</body>
</html>
