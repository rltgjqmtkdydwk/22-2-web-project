<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GitHub Site</title>
    <link rel="stylesheet" href="csscss/style.css">
</head>
<body>
<img src="https://heropcode.github.io/GitHub-Responsive/img/logo.svg">
<div class="navi">
    <ul class="first">
        <li>Personal</li>
        <li>Open source</li>
        <li>Business</li>
        <li>Explore</li>
    </ul>
    <ul class="second">
        <li>Pricing</li>
        <li>Blog</li>
        <li>Support</li>

        <input type="submit" value="Sign in">
        <input type="submit" value="Sign up" class="greenbox">
    </form>
</div>

<img src="https://heropcode.github.io/GitHub-Responsive/img/bg.jpg"
style="position: top;">
