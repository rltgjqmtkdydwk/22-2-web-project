<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GitHub</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="body_container">
    <header class="section">
        <div class="inner clearfix">
            <div class="menu-group float--left">
                <div class="logo">
                    <a href="#">GitHub</a>
                </div>
                <ul class="main-menu toggle">
                    <li>
                        <a href="#">Personal</a>
                    </li>
                    <li>
                        <a href="#">Open source</a>
                    </li>
                    <li>
                        <a href="#">Business</a>
                    </li>
                    <li>
                        <a href="#">Explore</a>
                    </li>
                </ul>
            </div>
            <div class="sign-group float--left toggle">
                <div class="btn-group">
                    <a class="btn sign-in" href="#">Sign in</a>
                    <a class="btn btn--primary sign-up" href="#">Sign up</a>
                </div>
                <form id="search-form" method="post" action>
                <input id="search" class="input--text" type="text" placeholder="Search GitHub">
                <input type="submit">
                </form>
                <ul class="sub-menu">
                    <li>
                        <a href="#">Pricing</a>
                    </li>
                    <li>
                        <a href="#">Blog</a>
                    </li>
                    <li>
                        <a href="#">Support</a>
                    </li>
                </ul>
            </div>
            <div id="toggle-btn">Header Menu Toggle Button</div>
        </div>
    </header>
</div>
<section class="section section--visual">
    <div class="inner">
        <img src="https://heropcode.github.io/GitHub-Responsive/img/bg-small.jpg">
    </div>
  </section>
</body>
</html>
